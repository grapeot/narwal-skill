name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: create venv and install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: ruff
        run: uv run ruff check src tests scripts
      - name: pytest
        run: uv run pytest
      - name: import smoke
        run: uv run python scripts/smoke_import.py
